<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="艾爾之光-殞落之塔練習" />
    <meta
      property="og:image"
      content="https://neillife.github.io/ElswordWiltingTower/images/favicon.ico"
    />
    <meta
      property="og:description"
      content="根據殞落之塔羅馬數字的練習小工具，包括 高熵-數數兒 與 12 選 6 的機制練習。"
    />
  <title>Wilting Tower: Flight</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon" />
  <link href="./assets/style.css" rel="stylesheet">
</head>
<body>
  <div id="game">
    <div id="modeDisplay">殞落之塔-R2</div>
    <div id="timer">⏱️ 40</div>
    <select id="selectMode">
        <option value="MagicCircleSearch">12 選 6</option>
        <option value="HenirHighEntropy">高熵</option>
    </select>
    <button id="startBtn">開始練習</button>
    <div class="platform-group" id="topRow" style="display:none;"></div>
    <div class="platform-group" id="bottomRow" style="display:none;"></div>
    <div id="chatlog"></div>
    <div id="controls" style="display:none;">
      <input id="inputBox" placeholder="Enter briefing" />
      <span id="infoIcon" class="info-tooltip" title="小技巧:&#10;- 你無須按照所示格式輸入，重要的是結果。&#10;- 對於閉眼模式，你只需要輸入一個安全點數字，而不是全部。&#10;- 對於高熵模式，數字總和皆為 36，你只需要算一排減 36 即可，不需要計算全部。">❗</span>
    </div>
    <div id="recap" style="display:none;"></div>
    <div id="result"></div>
    <button id="retryBtn" style="display:none;">🔁 重新開始</button>
  </div>
  <script type="module" src="./assets/Main.js"></script>
  <footer class="simple-footer">
    <p>
      由 <strong>Neillife</strong> 修改 
      <span> | </span> 
      <a href="https://github.com/Neillife/ElswordWiltingTower" target="_blank">檢視原始碼</a> 
      <span> | </span> 
      工具概念源自：<a href="https://gall.dcinside.com/mgallery/board/view/?id=els&no=1749192" target="_blank">原始專案</a>
    </p>
  </footer>
</body>
</html>
